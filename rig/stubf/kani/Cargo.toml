# Kani proofs for the stub's kaslr_rs.rs:  cd rig/stubf/kani && cargo kani
# (the harnesses are the `#[cfg(kani)] mod proofs` at the bottom of kaslr_rs.rs itself).
[package]
name = "kaslr_rs_kani"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "../../../port/tree/arch/x86/boot/compressed/kaslr_rs.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)", "cfg(verbose_bootup)", "cfg(efi)", "cfg(unaccepted_memory)", "cfg(hotremove_acpi)", "cfg(kexec_handover)", "cfg(stubf_fake_hw)"] }
